<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00b4d8"/>
      <stop offset="100%" style="stop-color:#90e0ef"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- Decorative elements -->
  <rect x="60" y="60" width="2" height="280" rx="1" fill="#00b4d8" opacity="0.3"/>
  <rect x="738" y="60" width="2" height="280" rx="1" fill="#00b4d8" opacity="0.3"/>

  <!-- Terminal cursor lines -->
  <text x="100" y="100" font-family="Consolas,monospace" font-size="14" fill="#00b4d8" opacity="0.2">C:\&gt; mklink /J "C:\Data" "D:\Data"</text>
  <text x="100" y="340" font-family="Consolas,monospace" font-size="14" fill="#00b4d8" opacity="0.2">C:\&gt; dir  │  &lt;JUNCTION&gt;   Data  [D:\Data]</text>

  <text x="400" y="150" text-anchor="middle" font-family="Consolas,monospace" font-size="56" fill="url(#accent)" font-weight="bold" opacity="0.95">mklink</text>
  <text x="400" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="white" opacity="0.85">拯救 C 盘的 DOS 命令</text>
  <text x="400" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="white" opacity="0.6">把数据移到 D 盘，让软件以为还在 C 盘</text>
  <text x="400" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white" opacity="0.45">Use mklink to Free Up Your C Drive</text>
</svg>
